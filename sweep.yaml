# Wandb Sweep Configuration
# Run with: wandb sweep sweep.yaml
# Then: wandb agent <sweep_id>

program: experiments/sweep.py
method: bayes
metric:
  name: eval/win_rate_vs_random
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 3e-3
  clip_epsilon:
    distribution: uniform
    min: 0.1
    max: 0.4
  entropy_coeff:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  gamma:
    distribution: uniform
    min: 0.9
    max: 0.999
  gae_lambda:
    distribution: uniform
    min: 0.8
    max: 0.99
  n_epochs:
    values: [2, 4, 8, 16]
  om_loss_weight:
    distribution: uniform
    min: 0.1
    max: 1.0
  om_hidden_dim:
    values: [32, 64, 128]
  om_num_layers:
    values: [1, 2, 3]
  om_dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  value_loss_coeff:
    distribution: uniform
    min: 0.1
    max: 1.0
  grad_clip_norm:
    distribution: uniform
    min: 0.1
    max: 2.0

early_terminate:
  type: hyperband
  min_iter: 100
  eta: 3
